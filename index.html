<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>城市散步活動報名</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- STEP 1：固定導覽列 -->
  <header class="site-header">
    <h1>城市散步</h1>
    <nav>
      <a href="#event">活動資訊</a>
      <a href="#signup">立即報名</a>
    </nav>
  </header>

  <!-- STEP 2：主要視覺區 -->
  <section class="hero">
    <p>TAIPEI WALKING TOUR</p>
    <h2>大稻埕午後散步</h2>
    <p>穿過老街與河岸，在三小時內認識城市故事與生活風景。</p>
  </section>

  <!-- STEP 3 & 4：活動資訊卡片（含右上角 Badge） -->
  <section id="event" class="event-card with-badge">
    <span class="badge">剩 8 位</span>
    <h2>活動資訊</h2>
    <p>日期：2026 年 10 月 17 日</p>
    <p>時間：14:00–17:00</p>
    <p>集合：捷運北門站</p>
  </section>

  <!-- 挑戰題：集合提醒卡片 (.notice-card) -->
  <aside class="notice-card">
    <span class="notice-badge">提醒</span>
    <h2>集合提醒</h2>
    <p>請提前 10 分鐘抵達，並自備飲水。</p>
  </aside>

</body>
</html>
