<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <!-- STEP 1: Viewport 設定[cite: 1]-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>W07 基本網頁</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <a class="logo" href="#">城市散步</a>
    <nav class="site-nav">
      <a href="#events">活動</a>
      <a href="#about">關於</a>
      <a href="#signup">報名</a>
    </nav>
  </header>

  <main>
    <!-- STEP 4: Hero 區塊 -->
    <section class="hero">
      <div class="hero-content">
        <h1>週末城市散步</h1>
        <p>手機先排成單欄，螢幕夠寬再改成多欄。</p>
      </div>
    </section>

    <!-- STEP 1 & 2: 活動清單卡片 -->
    <section id="events" class="event-list">
      <div class="event-card">
        <h2>老街散步</h2>
        <p>走訪迪化街，認識街屋與商行故事。</p>
        <a href="#" class="btn">查看活動</a>
      </div>
      <div class="event-card">
        <h2>河岸夕陽</h2>
        <p>沿著河濱慢慢散步，拍下日落與城市天際線，行程約兩小時。</p>
        <a href="#" class="btn">查看活動</a>
      </div>
      <div class="event-card">
        <h2>市場早餐</h2>
        <p>從在地早餐開始認識市場。</p>
        <a href="#" class="btn">查看活動</a>
      </div>
    </section>

    <!-- STEP 5 (挑戰題): Promo Banner 宣傳區塊[cite: 1] -->
    <aside class="promo-banner">
      <div>
        <p>本週限定</p>
        <h2>兩人同行享九折</h2>
      </div>
      <a href="#signup" class="btn-promo">立即報名</a>
    </aside>
  </main>

</body>
</html>
